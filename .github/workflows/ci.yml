name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Tipos
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Datos publicados
        run: bun run check:data

      - name: Generación determinista
        run: |
          bun run data:check
          bun run sync
          git diff --exit-code -- worker/data web/public

      - name: Build
        run: bun run build

      - name: Dependencias de producción
        run: bun audit --prod --audit-level=high

name = "sinluz-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Reemplazar por el id real de `wrangler d1 create sinluz`
[[d1_databases]]
binding = "DB"
database_name = "sinluz"
database_id = "a8166ab2-3947-45fa-9731-58b5a5ede486"

# Workers AI: interpreta los avisos del canal (gratis hasta 10 000 neuronas/día).
[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[vars]
INGEST_URL = "https://tg.i-c-a.su/json/electricastgo"
INGEST_LIMIT = "30"
LLM_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
# Interruptor de emergencia: "false" deja de interpretar sin quitar el binding [ai].
# LLM_ENABLED = "false"

[observability]
enabled = true
